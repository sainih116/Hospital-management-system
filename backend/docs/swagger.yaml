basePath: /api/v1
definitions:
  hms-backend_internal_modules_appointments_dto.BookAppointmentRequest:
    properties:
      doctorId:
        type: string
      endAt:
        type: string
      patientId:
        type: string
      reason:
        maxLength: 500
        type: string
      startAt:
        type: string
    required:
    - doctorId
    - endAt
    - patientId
    - startAt
    type: object
  hms-backend_internal_modules_appointments_dto.ChangeStatusRequest:
    properties:
      reason:
        maxLength: 500
        type: string
      status:
        enum:
        - CONFIRMED
        - IN_PROGRESS
        - COMPLETED
        - CANCELLED
        - NO_SHOW
        type: string
    required:
    - status
    type: object
  hms-backend_internal_modules_appointments_dto.RescheduleRequest:
    properties:
      endAt:
        type: string
      startAt:
        type: string
    required:
    - endAt
    - startAt
    type: object
  hms-backend_internal_modules_auth_dto.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  hms-backend_internal_modules_auth_dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  hms-backend_internal_modules_auth_dto.LogoutRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  hms-backend_internal_modules_auth_dto.RefreshRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  hms-backend_internal_modules_auth_dto.RegisterRequest:
    properties:
      email:
        maxLength: 254
        type: string
      name:
        maxLength: 120
        minLength: 2
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      roleCode:
        enum:
        - ADMIN
        - DOCTOR
        - NURSE
        - RECEPTIONIST
        - PHARMACIST
        - LAB_TECHNICIAN
        type: string
    required:
    - email
    - name
    - password
    - roleCode
    type: object
  hms-backend_internal_modules_auth_dto.ResetPasswordRequest:
    properties:
      newPassword:
        maxLength: 72
        minLength: 8
        type: string
      token:
        type: string
    required:
    - newPassword
    - token
    type: object
  hms-backend_internal_modules_billing_dto.CreateBillItemRequest:
    properties:
      category:
        enum:
        - CONSULTATION
        - LAB
        - PHARMACY
        - PROCEDURE
        - ROOM_CHARGE
        - OTHER
        type: string
      description:
        maxLength: 200
        type: string
      quantity:
        minimum: 1
        type: integer
      unitPrice:
        minimum: 0
        type: number
    required:
    - category
    - description
    - quantity
    type: object
  hms-backend_internal_modules_billing_dto.CreateBillRequest:
    properties:
      discount:
        minimum: 0
        type: number
      items:
        items:
          $ref: '#/definitions/hms-backend_internal_modules_billing_dto.CreateBillItemRequest'
        minItems: 1
        type: array
      patientId:
        type: string
      tax:
        minimum: 0
        type: number
    required:
    - items
    - patientId
    type: object
  hms-backend_internal_modules_billing_dto.RecordPaymentRequest:
    properties:
      amount:
        type: number
      method:
        enum:
        - CASH
        - CARD
        - UPI
        - BANK_TRANSFER
        - INSURANCE
        type: string
      referenceNo:
        maxLength: 100
        type: string
    required:
    - amount
    - method
    type: object
  hms-backend_internal_modules_departments_dto.CreateDepartmentRequest:
    properties:
      code:
        maxLength: 20
        minLength: 2
        type: string
      name:
        maxLength: 120
        minLength: 2
        type: string
    required:
    - code
    - name
    type: object
  hms-backend_internal_modules_departments_dto.UpdateDepartmentRequest:
    properties:
      name:
        maxLength: 120
        minLength: 2
        type: string
      status:
        enum:
        - ACTIVE
        - INACTIVE
        type: string
    type: object
  hms-backend_internal_modules_doctors_dto.AvailabilitySlotRequest:
    properties:
      dayOfWeek:
        maximum: 6
        minimum: 0
        type: integer
      endTime:
        type: string
      startTime:
        type: string
    required:
    - dayOfWeek
    - endTime
    - startTime
    type: object
  hms-backend_internal_modules_doctors_dto.CreateDoctorRequest:
    properties:
      availability:
        items:
          $ref: '#/definitions/hms-backend_internal_modules_doctors_dto.AvailabilitySlotRequest'
        type: array
      bio:
        maxLength: 1000
        type: string
      departmentId:
        type: string
      fee:
        minimum: 0
        type: number
      licenseNo:
        maxLength: 60
        minLength: 2
        type: string
      specialization:
        maxLength: 120
        minLength: 2
        type: string
      userId:
        type: string
    required:
    - departmentId
    - fee
    - licenseNo
    - specialization
    - userId
    type: object
  hms-backend_internal_modules_doctors_dto.UpdateDoctorRequest:
    properties:
      availability:
        items:
          $ref: '#/definitions/hms-backend_internal_modules_doctors_dto.AvailabilitySlotRequest'
        type: array
      bio:
        maxLength: 1000
        type: string
      departmentId:
        type: string
      fee:
        minimum: 0
        type: number
      licenseNo:
        maxLength: 60
        minLength: 2
        type: string
      specialization:
        maxLength: 120
        minLength: 2
        type: string
    type: object
  hms-backend_internal_modules_ipd_dto.AdmitPatientRequest:
    properties:
      bedId:
        type: string
      doctorId:
        type: string
      patientId:
        type: string
      reason:
        maxLength: 500
        type: string
    required:
    - bedId
    - doctorId
    - patientId
    type: object
  hms-backend_internal_modules_ipd_dto.CreateBedRequest:
    properties:
      bedNumber:
        maxLength: 20
        minLength: 1
        type: string
      wardId:
        type: string
    required:
    - bedNumber
    - wardId
    type: object
  hms-backend_internal_modules_ipd_dto.CreateWardRequest:
    properties:
      code:
        maxLength: 20
        minLength: 2
        type: string
      name:
        maxLength: 120
        minLength: 2
        type: string
    required:
    - code
    - name
    type: object
  hms-backend_internal_modules_ipd_dto.DischargeRequest:
    properties:
      note:
        maxLength: 1000
        type: string
    type: object
  hms-backend_internal_modules_ipd_dto.UpdateBedRequest:
    properties:
      status:
        enum:
        - AVAILABLE
        - MAINTENANCE
        type: string
    required:
    - status
    type: object
  hms-backend_internal_modules_ipd_dto.UpdateWardRequest:
    properties:
      code:
        maxLength: 20
        minLength: 2
        type: string
      name:
        maxLength: 120
        minLength: 2
        type: string
      status:
        enum:
        - ACTIVE
        - INACTIVE
        type: string
    type: object
  hms-backend_internal_modules_laborders_dto.CreateLabOrderRequest:
    properties:
      doctorId:
        type: string
      patientId:
        type: string
      testId:
        type: string
    required:
    - doctorId
    - patientId
    - testId
    type: object
  hms-backend_internal_modules_laborders_dto.EnterResultRequest:
    properties:
      flag:
        enum:
        - NORMAL
        - LOW
        - HIGH
        - CRITICAL
        type: string
      notes:
        maxLength: 1000
        type: string
      resultValue:
        maxLength: 500
        type: string
    required:
    - flag
    - resultValue
    type: object
  hms-backend_internal_modules_labtests_dto.CreateLabTestRequest:
    properties:
      category:
        maxLength: 100
        type: string
      code:
        maxLength: 20
        minLength: 2
        type: string
      cost:
        minimum: 0
        type: number
      name:
        maxLength: 150
        minLength: 2
        type: string
      normalRange:
        maxLength: 100
        type: string
      sampleType:
        maxLength: 60
        type: string
      unit:
        maxLength: 30
        type: string
    required:
    - code
    - cost
    - name
    type: object
  hms-backend_internal_modules_labtests_dto.UpdateLabTestRequest:
    properties:
      category:
        maxLength: 100
        type: string
      cost:
        minimum: 0
        type: number
      name:
        maxLength: 150
        minLength: 2
        type: string
      normalRange:
        maxLength: 100
        type: string
      sampleType:
        maxLength: 60
        type: string
      status:
        enum:
        - ACTIVE
        - INACTIVE
        type: string
      unit:
        maxLength: 30
        type: string
    type: object
  hms-backend_internal_modules_medicalrecords_dto.CreateMedicalRecordRequest:
    properties:
      complaint:
        maxLength: 1000
        type: string
      diagnosis:
        maxLength: 1000
        minLength: 2
        type: string
      doctorId:
        type: string
      examination:
        maxLength: 2000
        type: string
      followUp:
        maxLength: 1000
        type: string
      history:
        maxLength: 2000
        type: string
      hpi:
        maxLength: 2000
        type: string
      patientId:
        type: string
      treatment:
        maxLength: 2000
        type: string
    required:
    - diagnosis
    - doctorId
    - patientId
    type: object
  hms-backend_internal_modules_medicalrecords_dto.UpdateMedicalRecordRequest:
    properties:
      complaint:
        maxLength: 1000
        type: string
      diagnosis:
        maxLength: 1000
        minLength: 2
        type: string
      examination:
        maxLength: 2000
        type: string
      followUp:
        maxLength: 1000
        type: string
      history:
        maxLength: 2000
        type: string
      hpi:
        maxLength: 2000
        type: string
      treatment:
        maxLength: 2000
        type: string
    type: object
  hms-backend_internal_modules_patients_dto.CreatePatientRequest:
    properties:
      address:
        maxLength: 300
        type: string
      allergies:
        items:
          type: string
        type: array
      bloodGroup:
        enum:
        - A+
        - A-
        - B+
        - B-
        - AB+
        - AB-
        - O+
        - O-
        type: string
      dob:
        description: '"YYYY-MM-DD"'
        type: string
      email:
        maxLength: 254
        type: string
      emergencyContact:
        $ref: '#/definitions/hms-backend_internal_modules_patients_dto.EmergencyContactRequest'
      gender:
        enum:
        - M
        - F
        - O
        type: string
      insurance:
        $ref: '#/definitions/hms-backend_internal_modules_patients_dto.InsuranceRequest'
      name:
        maxLength: 150
        minLength: 2
        type: string
      phone:
        type: string
      type:
        enum:
        - OPD
        - IPD
        type: string
    required:
    - dob
    - gender
    - name
    - phone
    - type
    type: object
  hms-backend_internal_modules_patients_dto.EmergencyContactRequest:
    properties:
      name:
        maxLength: 120
        minLength: 2
        type: string
      phone:
        type: string
      relationship:
        maxLength: 60
        type: string
    required:
    - name
    - phone
    type: object
  hms-backend_internal_modules_patients_dto.InsuranceRequest:
    properties:
      policyNumber:
        maxLength: 60
        type: string
      provider:
        maxLength: 120
        type: string
    type: object
  hms-backend_internal_modules_patients_dto.UpdatePatientRequest:
    properties:
      address:
        maxLength: 300
        type: string
      allergies:
        items:
          type: string
        type: array
      bloodGroup:
        enum:
        - A+
        - A-
        - B+
        - B-
        - AB+
        - AB-
        - O+
        - O-
        type: string
      dob:
        type: string
      email:
        maxLength: 254
        type: string
      emergencyContact:
        $ref: '#/definitions/hms-backend_internal_modules_patients_dto.EmergencyContactRequest'
      gender:
        enum:
        - M
        - F
        - O
        type: string
      insurance:
        $ref: '#/definitions/hms-backend_internal_modules_patients_dto.InsuranceRequest'
      name:
        maxLength: 150
        minLength: 2
        type: string
      phone:
        type: string
      type:
        enum:
        - OPD
        - IPD
        type: string
    type: object
  hms-backend_internal_modules_pharmacy_dto.CreateMedicineRequest:
    properties:
      category:
        maxLength: 100
        type: string
      genericName:
        maxLength: 150
        type: string
      manufacturer:
        maxLength: 150
        type: string
      name:
        maxLength: 150
        minLength: 2
        type: string
      reorderLevel:
        minimum: 0
        type: integer
      unit:
        maxLength: 30
        type: string
    required:
    - name
    type: object
  hms-backend_internal_modules_pharmacy_dto.DispenseItemRequest:
    properties:
      medicineId:
        type: string
      quantity:
        minimum: 1
        type: integer
    required:
    - medicineId
    - quantity
    type: object
  hms-backend_internal_modules_pharmacy_dto.DispenseRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/hms-backend_internal_modules_pharmacy_dto.DispenseItemRequest'
        minItems: 1
        type: array
      prescriptionId:
        type: string
    required:
    - items
    - prescriptionId
    type: object
  hms-backend_internal_modules_pharmacy_dto.ReceiveBatchRequest:
    properties:
      batchNo:
        maxLength: 60
        type: string
      expiryDate:
        type: string
      purchasePrice:
        minimum: 0
        type: number
      quantity:
        minimum: 1
        type: integer
      sellingPrice:
        minimum: 0
        type: number
    required:
    - batchNo
    - expiryDate
    - quantity
    type: object
  hms-backend_internal_modules_pharmacy_dto.UpdateMedicineRequest:
    properties:
      category:
        maxLength: 100
        type: string
      genericName:
        maxLength: 150
        type: string
      manufacturer:
        maxLength: 150
        type: string
      name:
        maxLength: 150
        minLength: 2
        type: string
      reorderLevel:
        minimum: 0
        type: integer
      status:
        enum:
        - ACTIVE
        - INACTIVE
        type: string
      unit:
        maxLength: 30
        type: string
    type: object
  hms-backend_internal_modules_prescriptions_dto.ChangeStatusRequest:
    properties:
      status:
        enum:
        - CANCELLED
        type: string
    required:
    - status
    type: object
  hms-backend_internal_modules_prescriptions_dto.CreatePrescriptionRequest:
    properties:
      doctorId:
        type: string
      items:
        items:
          $ref: '#/definitions/hms-backend_internal_modules_prescriptions_dto.ItemRequest'
        minItems: 1
        type: array
      medicalRecordId:
        type: string
      patientId:
        type: string
    required:
    - doctorId
    - items
    - patientId
    type: object
  hms-backend_internal_modules_prescriptions_dto.ItemRequest:
    properties:
      dose:
        maxLength: 60
        type: string
      duration:
        maxLength: 60
        type: string
      frequency:
        maxLength: 60
        type: string
      instructions:
        maxLength: 300
        type: string
      medicineName:
        maxLength: 200
        minLength: 2
        type: string
    required:
    - dose
    - duration
    - frequency
    - medicineName
    type: object
  hms-backend_internal_response.Envelope:
    properties:
      data: {}
      error:
        $ref: '#/definitions/hms-backend_internal_response.ErrorBody'
      meta:
        $ref: '#/definitions/hms-backend_internal_response.Meta'
      success:
        type: boolean
    type: object
  hms-backend_internal_response.ErrorBody:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
    type: object
  hms-backend_internal_response.Meta:
    properties:
      requestId:
        type: string
    type: object
info:
  contact:
    name: HMS Engineering
  description: REST API for the Hospital Management System (Auth, Patients, Doctors,
    Appointments, EMR, Laboratory, Pharmacy, Billing, IPD/Wards, Reporting).
  license:
    name: Proprietary
  termsOfService: http://swagger.io/terms/
  title: Hospital Management System API
  version: "1.0"
paths:
  /appointments:
    get:
      description: Paginated, filterable appointment search — also serves as the doctor
        schedule view (filter by doctorId + from/to).
      parameters:
      - description: Filter by patient
        in: query
        name: patientId
        type: string
      - description: Filter by doctor
        in: query
        name: doctorId
        type: string
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Range start (RFC3339)
        in: query
        name: from
        type: string
      - description: Range end (RFC3339)
        in: query
        name: to
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hms-backend_internal_response.Envelope'
      security:
      - BearerAuth: []
      summary: Search appointments
      tags:
      - appointments
    post:
      consumes:
      - application/json
      description: Creates a SCHEDULED appointment. Rejects overlapping/duplicate-slot
        bookings for the same doctor.
      parameters:
      - description: New appointment
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/hms-backend_internal_modules_appointments_dto.BookAppointmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/hms-backend_internal_response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/hms-backend_internal_response.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/hms-backend_internal_response.Envelope'
      security:
      - BearerAuth: []
      summary: Book an appointment
      tags:
      - appointments
  /appointments/{id}:
    get:
      parameters:
      - description: Appointment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hms-backend_internal_response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/hms-backend_internal_response.Envelope'
      security:
      - BearerAuth: []
      summary: Appointment details
      tags:
      - appointments
  /appointments/{id}/reschedule:
    post:
      consumes:
      - application/json
      description: Admin/Receptionist only. Marks the current appointment RESCHEDULED
        and creates a new SCHEDULED one at the requested time.
      parameters:
      - description: Appointment ID
        in: path
        name: id
        required: true
        type: string
      - description: New time slot
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/hms-backend_internal_modules_appointments_dto.RescheduleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/hms-backend_internal_response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/hms-backend_internal_response.Envelope'
      security:
      - BearerAuth: []
      summary: Reschedule an appointment
      tags:
      - appointments
  /appointments/{id}/status:
    patch:
      consumes:
      - application/json
      description: Admin/Receptionist may make any valid transition. A Doctor may
        only progress their own appointments through IN_PROGRESS/COMPLETED/NO_SHOW.
      parameters:
      - description: Appointment ID
        in: path
        name: id
        required: true
        type: string
      - description: New status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/hms-backend_internal_modules_appointments_dto.ChangeStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hms-backend_internal_response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/hms-backend_internal_response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/hms-backend_internal_response.Envelope'
      security:
      - BearerAuth: []
      summary: Change an appointment's status
      tags:
      - appointments
  /audit-logs:
    get:
      description: Admin-only. Every mutating action across every module is recorded
        here as it happens (internal/audit.Recorder) — this endpoint only queries
        the resulting history.
      parameters:
      - description: Filter by the acting user's ID
        in: query
        name: actorId
        type: string
      - description: Filter by entity type, e.g. patient, pharmacy, billing
        in: query
        name: entityType
        type: string
      - description: Filter by a specific entity's ID
        in: query
        name: entityId
        type: string
      - description: Filter by action code, e.g. BILL_CREATED
        in: query
        name: action
        type: string
      - description: RFC3339 lower bound on createdAt
        in: query
        name: from
        type: string
      - description: RFC3339 upper bound on createdAt
        in: query
        name: to
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hms-backend_internal_response.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/hms-backend_internal_response.Envelope'
      security:
      - BearerAuth: []
      summary: Search audit logs
      tags:
      - audit-logs
  /auth/login:
    post:
      consumes:
      - application/json
      description: Exchanges email/password for an access token and a refresh token.
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/hms-backend_internal_modules_auth_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hms-backend_internal_response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/hms-backend_internal_response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/hms-backend_internal_response.Envelope'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/hms-backend_internal_response.Envelope'
      summary: Authenticate
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the given refresh token. Idempotent.
      parameters:
      - description: Refresh token to revoke
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/hms-backend_internal_modules_auth_dto.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hms-backend_internal_response.Envelope'
