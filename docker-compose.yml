name: hms

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: hms
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
      args:
        VERSION: local
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      PORT: 5000
      APP_BASE_URL: http://localhost:5000
      FRONTEND_BASE_URL: http://localhost:8080
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
      LOG_LEVEL: debug
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: hms
      REDIS_ENABLED: "true"
      REDIS_ADDR: redis:6379
      JWT_ACCESS_SECRET: local-dev-access-secret-change-me
      JWT_REFRESH_SECRET: local-dev-refresh-secret-change-me
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  seed:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
      args:
        VERSION: local
    profiles: ["tools"]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: hms
      SEED_ADMIN_EMAIL: admin@hms.local
      SEED_ADMIN_NAME: System Administrator
      SEED_ADMIN_PASSWORD: ChangeMe123!
      SEED_DOCTOR_PASSWORD: ChangeMe123!
      # cmd/seed never issues a JWT, but it loads the same Config struct as
      # the API server, which now refuses to start with an empty JWT
      # secret (see internal/config.validate). Reuse the backend service's
      # dev-only secrets so this container keeps starting.
      JWT_ACCESS_SECRET: local-dev-access-secret-change-me
      JWT_REFRESH_SECRET: local-dev-refresh-secret-change-me
    entrypoint: ["./hms-seed"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo_data:
  redis_data:
